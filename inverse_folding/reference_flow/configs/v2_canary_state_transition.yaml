# V2 state-transition Canary -- PLAN_RF_REFINE_FUSION_V2 §8.3, runbook doc/RF_Fusion_v2_Cluster_Runbook.md
#
# Every REPLACE_* below is a value this file CANNOT carry: the loader has no defaults for them and
# refuses the run rather than inventing one.  Fill them from the artifacts the runbook's steps 1-2
# produce -- a placeholder left in place fails closed at --print-config, not on the GPU.
#
# depth_cap is 1 on purpose: PLAN §8.4 keeps production D>1 launch-disabled until a powered
# source-transmission gate AND the FeedbackSupportPolicy directionality gate both pass, and the
# oracle factory never grants the capability flag.

arm:
  a2_matching_resource: definitive_refolds
  a2_unmatched_reported:
  - gpu_seconds
  - head_calls
  - logical_dfe
  - walltime_s
  arm_role: v2
  feedback_enabled: true
caps:
  max_definitive_refolds: 4000
  max_gpu_seconds: 86400
  max_head_calls: 20000
  max_logical_dfe: 500000
  max_retries: 2
  max_walltime_s: 21600
  retry_scope: per_request
content:
- binding: runtime
  expected_sha256: null
  label: backbone.bin
  role: backbone
- binding: runtime
  expected_sha256: null
  label: code_revision.bin
  role: code_revision
- binding: runtime
  expected_sha256: null
  label: cohort_table.bin
  role: cohort_table
- binding: frozen
  expected_sha256: REPLACE_sha256_of_complete_reference_sequence
  label: complete_reference_sequence.bin
  role: complete_reference_sequence
- binding: runtime
