# V2 high-risk capability structure gate. Only scTM >= 0.70 is used online; hard anchors remain
# sequence-identity constraints and are not reinterpreted as active-site geometry. All evaluated
# endpoints remain in the V2 evidence bundle and scTM >= 0.85 is a post-hoc reporting subset.
fusion:
  enabled: true
  seed: 20260715
  population_size: 4
  n_rounds: 6

  handoff:
    mode: terminal_population

  targeting:
    mode: head_max_window
    registers_per_parent: 1
    halo_radius: 4

  objective:
    head_field: global_risk
    min_head_improvement: 0.05
    max_offtarget_window_increase: 0.10

  moves:
    explicit:
      enabled: true
      max_edit_order: 2
      max_raw_candidates_per_parent: 200
      pair_seed_budget: 32
    rf_reopen:
      enabled: false
      children_per_parent: 0
    repair:
      enabled: false
      repair_shortlist_per_parent: 4
      children_per_edit: 1
      sampler_steps: 8
      local_remask: false

  structure:
    backend: esmfold2_live
    surrogate_mode: none
    scTM_min: 0.70
    active_site_metric: none
    max_anchor_sidechain_RMSD_max: null
    active_site_RMSD_max: null
    active_site_shell_radius: 6.0
    scRMSD_max: null
    cache_dir: structure_cache
    max_refolds_per_parent: 8

  selection:
    mode: greedy
    beta_start: 1.0
    beta_end: 4.0
    resample_method: multinomial

  telemetry:
    candidate_detail: true
    window_detail: false
    trajectory_detail: true
