name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt pytest==9.0.2
      - run: python -m pytest tests -q
        env:
          OMP_NUM_THREADS: '1'
      - run: python -m pip install -r requirements-generation.txt
      - run: python -m pip install torch-scatter -f https://data.pyg.org/whl/torch-2.7.0+cpu.html
      - run: python -c 'from inverse_folding.reference_flow.runtime import _load_byprot_imports; _load_byprot_imports()'
