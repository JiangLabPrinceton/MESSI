  note: The contacted PD-1 face (62-66, 75-78, 83-88, 126-136) is the PD-L1-binding
    surface, i.e. this binder is PD-L1-competitive.
structure_provenance:
  backbone: bound-state binder chain from the top-ranked complex sample
  rationale: apo and bound cores agree (5-104 Ca RMSD 0.69 A) but the N-terminus 0-9
    is mobile in apo (intra-apo ensemble spread 1.75 A vs 0.23 A for the complex)
    and is ordered on binding; anchors 0-4 sit in that segment, so the apo backbone
    would place 5 of 24 interface residues arbitrarily.
