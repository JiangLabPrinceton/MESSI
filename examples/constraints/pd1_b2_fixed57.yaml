  - 30
  - 31
  - 32
  - 34
  - 35
  - 44
  - 45
  - 48
  - 49
  - 52
  - 90
  - 94
  note: '1-based indices into the 114-aa binder chain (no UniProt entry for a de novo
    design). This is the 24-residue CONTACT set only, NOT the 57 hard anchors: the
    33 support-shell residues are frozen for safety, not because they are functional,
    so cat_max_scRMSD (scripts/refine_rf_designs.py) must be read over the contact
    set. Without this block refinement would reject a non-_v0 schema outright.'
lock_set_admissibility:
  rule: an epitope is removable under this lock set iff >=1 of its P1/P4/P6/P9 anchor
    pockets (9-mer core offsets 0/3/5/8) is outside hard_anchors
  checked_epitopes:
  - allele: HLA-DRB1*04:01
    core: LDPDSTDPG
    core_start_0b: 7
    free_pockets: P4 (idx 10), P6 (idx 12)
    locked_pockets: P1 (idx 7, shell), P9 (idx 15, contact)
    verdict: removable
  - allele: HLA-DRB1*15:01
    core: LVKYLGISR
    core_start_0b: 52
    free_pockets: P6 (idx 57), P9 (idx 60)
    locked_pockets: P1 (idx 52, shell), P4 (idx 55, shell)
    verdict: removable
  - allele: HLA-DRB1*15:01
    core: PAAYAALAA
    core_start_0b: 78
    free_pockets: P1 (idx 78), P4 (idx 81), P6 (idx 83)
    locked_pockets: P9 (idx 86, shell)
    verdict: removable
  verdict: ADMISSIBLE - all three epitopes retain >=2 free anchor pockets
target_annotation:
  target: PD1_ECTO_Q15116_33_150
  uniprot: Q15116
  construct_1b:
  - 33
