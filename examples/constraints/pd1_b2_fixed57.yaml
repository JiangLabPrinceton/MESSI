schema_version: pd1_binder_interface_v2
description: 'PD1_b2: 24 interface contacts plus 33 support-shell residues hard-fixed;
  57 of 114 positions.'
annotation_provenance:
  direct_functional_union_uniprot_1b:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 16
  - 19
  - 23
  - 24
  - 26
  - 27
